[tool.hatch.build.targets.wheel]
exclude = ["/tests", "/scripts", "/docs", "/.gitattributes", "/.gitignore", "/CITATION.cff", "/CONTRIBUTING.md", "/LICENSE", "/LICENSES", "/README.md", "/SECURITY.md", "/pyproject.toml", "/requirements-*.txt"]

[tool.hatch.build.targets.wheel.sources]
"examples/crp-saa-trial" = "medextract_dossier/data/crp-saa-trial"
"examples/marker-mx1" = "medextract_dossier/data/marker-mx1"
